name: Flutter CI/CD

on:
  push:
    branches: [ main, develop, DhiWise-vlE7clKW ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Add permissions for creating releases
permissions:
  contents: write  # Needed for creating releases and uploading assets

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # - name: Run tests
      #   run: flutter test

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > /dev/null

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      # - name: Run tests with coverage
      #   run: flutter test --coverage

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build-android:
    name: Build Android APK & Bundle
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks

      - name: Create gradle.properties
        run: |
          echo "RELEASE_STORE_FILE=key.jks" >> android/gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "RELEASE_KEY_ALIAS=upload" >> android/gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/apk/release/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  publish-release:
    name: Publish APK and AAB to GitHub Release
    runs-on: ubuntu-latest
    needs: build-android
    # if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download Android builds artifact
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: android-builds

      - name: List downloaded files (debug)
        run: |
          echo "Contents of android-builds directory:"
          ls -la android-builds/

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: auto-${{ github.run_number }}
          name: Auto Release ${{ github.run_number }}
          draft: false
          prerelease: false
          artifacts: "android-builds/app-release.apk,android-builds/app-release.aab"
          token: ${{ secrets.GITHUB_TOKEN }}
