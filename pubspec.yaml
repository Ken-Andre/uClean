name: ucleankim
description: A new Flutter project.
version: 1.0.18+1
environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies: 
  flutter: 
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  flutter_bloc: ^9.1.1
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.0
  equatable: ^2.0.7
  lottie: ^3.3.1
  pin_code_fields: ^8.0.1
  sms_autofill: ^2.4.1
  flutter_svg_provider: ^1.0.7
  grouped_list: ^6.0.0
  url_launcher: ^6.3.1
  dio: ^5.8.0+1
  fluttertoast: ^8.2.12
  mockito: ^5.4.6
  permission_handler: ^12.0.0+1
  geocoding_platform_interface: ^3.2.0
  dots_indicator: ^4.0.1
dev_dependencies: 
  flutter_test: 
    sdk: flutter
flutter: 
  uses-material-design: true
  assets: 
    #- assets/
    - assets/images/
    - assets/lottieFiles/
  fonts:
      - family: Poppins
        fonts:
        - asset: assets/fonts/PoppinsSemiBold.ttf
          weight: 600
        - asset: assets/fonts/PoppinsRegular.ttf
          weight: 400
        - asset: assets/fonts/PoppinsMedium.ttf
          weight: 500
        - asset: assets/fonts/PoppinsLight.ttf
          weight: 300
        - asset: assets/fonts/PoppinsBold.ttf
          weight: 700
      - family: Inter
        fonts:
        - asset: assets/fonts/InterSemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterMedium.ttf
          weight: 500
        - asset: assets/fonts/InterRegular.ttf
          weight: 400
        - asset: assets/fonts/InterBold.ttf
          weight: 700