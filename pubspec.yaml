name: ucleankim
description: A Flutter application for school cleaning task management.
version: 1.0.19+1

environment: 
  sdk: '>=3.0.0 <4.0.0'

dependencies: 
  flutter: 
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  flutter_bloc: ^8.1.4
  connectivity_plus: ^6.0.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.14
  equatable: ^2.0.7
  lottie: ^3.1.0 
  pin_code_fields: ^8.0.1
  sms_autofill: ^2.4.0
  flutter_svg_provider: ^1.0.7
  grouped_list: ^6.0.0
  url_launcher: ^6.3.0
  dio: ^5.5.0
  fluttertoast: ^8.2.8
  mockito: ^5.4.4
  permission_handler: ^11.4.0
  geocoding_platform_interface: ^3.2.0
  dots_indicator: ^3.0.0
  flutter_markdown: ^0.7.4
  path_provider: ^2.1.4
  intl: ^0.20.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  network_info_plus: ^5.0.3
  pedometer: ^4.0.1

dev_dependencies: 
  flutter_test: 
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_animate: ^4.5.0
flutter: 
  uses-material-design: true
  assets: 
    #- assets/
    - assets/images/
    - assets/lottieFiles/
    - assets/articles/
  fonts:
      - family: Poppins
        fonts:
        - asset: assets/fonts/PoppinsSemiBold.ttf
          weight: 600
        - asset: assets/fonts/PoppinsRegular.ttf
          weight: 400
        - asset: assets/fonts/PoppinsMedium.ttf
          weight: 500
        - asset: assets/fonts/PoppinsLight.ttf
          weight: 300
        - asset: assets/fonts/PoppinsBold.ttf
          weight: 700
      - family: Inter
        fonts:
        - asset: assets/fonts/InterSemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterMedium.ttf
          weight: 500
        - asset: assets/fonts/InterRegular.ttf
          weight: 400
        - asset: assets/fonts/InterBold.ttf
          weight: 700